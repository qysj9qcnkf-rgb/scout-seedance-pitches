<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:#0b0c0e;display:grid;place-items:center;font-family:-apple-system,"Inter",system-ui,sans-serif}
.c{width:900px;background:#fff;border-radius:48px;padding:48px;box-shadow:0 40px 120px rgba(0,0,0,.5)}
.top{display:flex;align-items:center;gap:26px}
.pp{width:96px;height:96px;border-radius:50%;background:#111;display:grid;place-items:center}
.pp i{width:12px;height:38px;background:#fff;margin:0 5px;border-radius:3px}
.t{flex:1}.lab{font:600 30px ui-monospace,Menlo,monospace;letter-spacing:6px;color:#111}.lab b{color:#2fd27a}
.tr{height:8px;background:#e6e6e6;border-radius:6px;margin-top:18px;position:relative}.tr:before{content:"";position:absolute;left:0;top:0;bottom:0;width:58%;background:#111;border-radius:6px}
.wf{margin-top:36px;height:300px;padding-top:50px;background:#111;border-radius:30px;display:flex;align-items:center;justify-content:center;gap:9px;position:relative}
.wf span{width:11px;border-radius:6px;background:#3ee59a}
.who{position:absolute;top:22px;left:30px;font:600 24px ui-monospace,Menlo,monospace;letter-spacing:4px;color:#888}.who b{color:#3ee59a}
.chip{margin-top:40px;display:flex;align-items:center;gap:26px;border:5px solid #d1fb18;background:#f7fde0;border-radius:28px;padding:26px}
.sw{width:120px;height:120px;border-radius:20px;background:linear-gradient(135deg,#ffb36b,#f0635a)}
.k{font:600 24px ui-monospace,Menlo,monospace;letter-spacing:4px;color:#555}
.v{font-size:52px;font-weight:700;color:#111;margin-top:6px}
.n{font-size:40px;font-weight:600;color:#111;margin-top:4px}.n em{font-style:normal;background:#d1fb18;padding:0 8px;border-radius:8px}
</style></head><body><div class="c">
<div class="top"><div class="pp"><i></i><i></i></div><div class="t"><div class="lab"><b>&#9679;</b> THE CALL</div><div class="tr"></div></div></div>
<div class="wf"><div class="who">SCOUT &nbsp; <b>&#9679; SHOPPER</b></div>
<script>for(let i=0;i<34;i++){const h=40+Math.round(200*Math.abs(Math.sin(i*1.7)*Math.cos(i*.45)));document.write('<span style="height:'+h+'px"></span>')}</script></div>
<div class="chip"><div class="sw"></div><div><div class="k">IN CART</div><div class="v">Sunset bikini</div><div class="n">Added <em>3 times</em></div></div></div>
</div></body></html>
