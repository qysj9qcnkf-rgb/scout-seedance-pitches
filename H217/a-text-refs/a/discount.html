<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html{zoom:1.3}body{width:1231px;height:770px;font-family:-apple-system,"SF Pro Text","Inter",system-ui,sans-serif;background:#1a1a1a;color:#303030;display:flex;overflow:hidden}
.side{width:236px;color:#e3e3e3;padding:14px 10px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.bag{width:26px;height:28px;background:#95bf47;border-radius:4px 4px 6px 6px;position:relative;margin:0 6px 14px}
.bag:after{content:"S";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
.search{background:#303030;border-radius:8px;padding:7px 10px;color:#8a8a8a;margin-bottom:12px}
.it{padding:7px 10px;border-radius:8px}.it.on{background:#303030;color:#fff;font-weight:600}
.foot{margin-top:auto;padding:8px 10px;display:flex;gap:8px;align-items:center}
.av{width:22px;height:22px;border-radius:6px;background:#e07a5f;color:#fff;font-size:11px;display:grid;place-items:center;font-weight:700}
.main{flex:1;background:#f1f1f1;border-radius:14px 0 0 0;margin-top:8px;padding:30px 60px}
.hd{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700;margin-bottom:24px}
.hd span{font-size:14px;color:#616161;font-weight:500}
.grid{display:flex;gap:22px}
.col{flex:1;display:flex;flex-direction:column;gap:18px}
.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 1px 0 #e3e3e3}
.lbl{font-size:15px;font-weight:600;margin-bottom:10px}
.in{border:1px solid #8a8a8a;border-radius:9px;padding:12px 14px;font-size:22px;font-weight:600;letter-spacing:1px}
.row{display:flex;gap:14px;align-items:center}
.pct{font-size:44px;font-weight:700;color:#c5280c}
.prod{display:flex;gap:14px;align-items:center;font-size:17px;font-weight:600}
.sw{width:58px;height:58px;border-radius:10px;background:linear-gradient(135deg,#ffb36b,#f0635a)}
.sum{width:380px}
.sum li{font-size:15px;color:#303030;margin:8px 0 8px 18px}
.bar{position:absolute;right:60px;bottom:40px;display:flex;gap:12px}
.btn{padding:14px 26px;border-radius:10px;font-size:18px;font-weight:700}
.b1{background:#fff;border:1px solid #c9c9c9}.b2{background:#303030;color:#fff;box-shadow:0 0 0 4px rgba(48,48,48,.15)}
</style></head><body>
<div class="side"><div class="bag"></div><div class="search">Search</div>
<div class="it">Home</div><div class="it">Orders</div><div class="it">Products</div><div class="it">Customers</div><div class="it">Marketing</div>
<div class="it on">Discounts</div><div class="it">Content</div><div class="it">Analytics</div>
<div class="foot"><div class="av">SS</div>Salt &amp; Sun Swim</div></div>
<div class="main">
<div class="hd">Create discount <span>Amount off products</span></div>
<div class="grid"><div class="col">
<div class="card"><div class="lbl">Discount code</div><div class="in">WEEKEND20</div></div>
<div class="card"><div class="lbl">Discount value</div><div class="row"><div class="pct">20% off</div></div></div>
<div class="card"><div class="lbl">Applies to</div><div class="prod"><div class="sw"></div>Sunset bikini</div></div>
</div><div class="col sum"><div class="card"><div class="lbl">Summary</div><ul><li>20% off Sunset bikini</li><li>Starts today</li><li>All customers</li></ul></div></div></div>
<div class="bar"><div class="btn b1">Discard</div><div class="btn b2">Save discount</div></div>
</div></body></html>
