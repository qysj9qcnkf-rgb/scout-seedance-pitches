<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:-apple-system,"SF Pro Display","Inter",system-ui,sans-serif;
background:radial-gradient(1400px 900px at 70% 10%,#fff3df 0%,transparent 60%),repeating-linear-gradient(92deg,#e9d6b8 0 22px,#e3cdac 22px 40px,#ecdcc2 40px 70px);position:relative}
.towel{position:absolute;left:-60px;top:-40px;width:520px;height:260px;border-radius:30px;background:repeating-linear-gradient(90deg,#2f6fb3 0 46px,#f7f4ee 46px 92px);transform:rotate(-8deg);box-shadow:0 30px 60px rgba(80,50,20,.25)}
.bikini{position:absolute;right:-30px;top:40px;width:330px;height:200px;border-radius:120px 120px 60px 60px;background:#f07a5c;transform:rotate(14deg);box-shadow:0 24px 50px rgba(80,50,20,.25)}
.phone{position:absolute;left:120px;top:250px;width:840px;height:1740px;border-radius:120px;background:#d8d8dc;padding:14px;box-shadow:0 60px 120px rgba(60,35,10,.35),inset 0 0 0 4px #f4f4f6}
.scr{width:100%;height:100%;border-radius:108px;overflow:hidden;position:relative;background:linear-gradient(180deg,#2a6fa8 0%,#4fa3c7 38%,#f2b880 78%,#f08a5d 100%)}
.island{position:absolute;left:50%;top:34px;transform:translateX(-50%);width:250px;height:72px;border-radius:40px;background:#000}
.date{position:absolute;top:190px;width:100%;text-align:center;color:#fff;font-size:46px;font-weight:600}
.time{position:absolute;top:240px;width:100%;text-align:center;color:#fff;font-size:250px;font-weight:700;letter-spacing:-6px;line-height:1}
.n{position:absolute;left:44px;right:44px;top:560px;border-radius:44px;background:rgba(235,235,240,.82);padding:30px 34px;display:flex;gap:26px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.ic{flex:none;width:86px;height:86px;border-radius:22px;background:#fff;display:grid;place-items:center}
.bag{width:52px;height:56px;background:#95bf47;border-radius:6px 6px 10px 10px;position:relative}
.bag:before{content:"";position:absolute;left:13px;top:-12px;width:22px;height:18px;border:5px solid #95bf47;border-bottom:0;border-radius:12px 12px 0 0}
.t{flex:1;min-width:0}.h{display:flex;justify-content:space-between;font-size:38px;font-weight:700;color:#111}.h span{font-weight:400;color:#6b6b70;font-size:32px}
.b{font-size:38px;line-height:1.28;color:#111;margin-top:4px}
.bar{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:300px;height:12px;border-radius:8px;background:#fff}
</style></head><body><div class="towel"></div>
<div class="phone"><div class="scr"><div class="island"></div><div class="date">Tuesday, November 17</div><div class="time">9:41</div>
<div class="n"><div class="ic"><div class="bag"></div></div><div class="t"><div class="h">Refund issued<span>now</span></div><div class="b">[SALT &amp; SUN SWIM] Refund of $68.00 issued for 1 item.</div></div></div>
<div class="bar"></div></div></div></body></html>
